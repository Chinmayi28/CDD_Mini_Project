name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t securevault .
      - name: Run the container and check it is healthy
        run: |
          docker run -d --name sv -p 8000:8000 securevault
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/api/health && exit 0
            sleep 2
          done
          docker logs sv
          exit 1
