name: CI/CD
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt ruff pip-audit
      - run: ruff check --select F,E9 app tests
      - name: Validate tariff files
        run: python -c "from app.engine.tariff import list_tariffs; print(list_tariffs())"
      - name: Tests (tariff tests are the gate for tariff-file changes)
        run: pytest -q
      - run: pip-audit -r requirements.txt || true
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Smoke test
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf localhost:8000/tariffs
          docker compose down -v
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy (Render/Railway deploy hook stored as a secret)
        run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
