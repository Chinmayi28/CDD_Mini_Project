services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bill
      POSTGRES_PASSWORD: ${DB_PASSWORD:-billpass}
      POSTGRES_DB: billdb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bill -d billdb"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://bill:${DB_PASSWORD:-billpass}@db:5432/billdb
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:80"]
volumes:
  pgdata:
